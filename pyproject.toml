[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ttfeedhub"
version = "0.1.0"
description = "Shared tastytrade DXLink market-data hub"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
  "orjson>=3.10,<4",
  "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src", "client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "client", "."]
markers = ["bench: latency benchmark, run with scripts/bench.sh"]
addopts = "-m 'not bench'"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "client"]
packages = ["ttfeedhub", "ttfeedhub_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC"]
"scripts/**" = ["S"]
